<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a08" />
    <meta name="color-scheme" content="dark" />
    <title>Mafia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Limelight&family=Marcellus+SC&family=Playfair+Display:ital,wght@1,900&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-theme="lobby">
    <div class="sky" aria-hidden="true">
      <i class="burst"></i>
      <i class="fog f1"></i><i class="fog f2"></i><i class="fog f3"></i>
      <i class="moon"><i class="cloud c1"></i><i class="cloud c2"></i></i>
      <i class="warm"></i>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="app">
      <header id="hud" hidden></header>
      <main id="screen"></main>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>This game needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
